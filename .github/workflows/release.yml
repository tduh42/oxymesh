name: release

# Firmware images for every board and role, published on GitHub:
# - each push to main replaces the `nightly` prerelease (the latest main, always one);
# - a `v*` tag (e.g. v0.2.0) makes a release of that name.
# main only moves through pull requests whose CI passed, so this does not run the tests again;
# it lints and builds the firmware (scripts/firmware-ci.sh) before publishing.

on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  # A newer push to main supersedes the nightly being built; tags each run to the end.
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.ref == 'refs/heads/main' }}

jobs:
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: esp-rs/xtensa-toolchain@v1.7.0
        env:
          # espup queries GitHub's API for the toolchain; unauthenticated, it hits the rate limit.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          buildtargets: esp32s3
          version: 1.97.0.0
          ldproxy: false
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: firmware/esp32s3
      # Format, clippy (also with `debug-log`), build, image size: what CI checks.
      - run: scripts/firmware-ci.sh
      - run: scripts/release.sh dist
      - name: Publish the nightly prerelease
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete nightly --yes --cleanup-tag || true
          gh release create nightly dist/*.elf dist/*.csv dist/SHA256SUMS \
            --prerelease --target "$GITHUB_SHA" \
            --title "Latest main (${GITHUB_SHA::7})" --notes-file dist/NOTES.md
      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.elf dist/*.csv dist/SHA256SUMS \
            --verify-tag --title "oxymesh $GITHUB_REF_NAME" --notes-file dist/NOTES.md
